# Live example: change url and status_page_slug to match your status page.
schema_version: 1
mode: live
server:
  host: 0.0.0.0
  port: 3000
  log_level: info
presentation:
  branding:
    title: Hrafnholt
    subtitle: My home dashboard
    home_label: Home
  locale: en-US
  timezone: UTC
  home: null
  privacy:
    default_mode: public
    allow_private_toggle: false
  units:
    temperature: celsius
collectors:
  - type: uptime_kuma
    id: services
    name: My services
    url: https://status.example
    status_page_slug: home
    tls_verify: true
