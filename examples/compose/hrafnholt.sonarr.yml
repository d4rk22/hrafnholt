# Live example: change url to the address of your Sonarr service.
schema_version: 1
mode: live
server:
  host: 0.0.0.0
  port: 3000
  log_level: info
presentation:
  branding:
    title: Hrafnholt
    subtitle: My home dashboard
    home_label: Home
  locale: en-US
  timezone: UTC
  home: null
  privacy:
    default_mode: public
    allow_private_toggle: false
  units:
    temperature: celsius
collectors:
  - type: sonarr
    id: television
    name: Television
    url: https://sonarr.example
    api_key_ref: SONARR_API_KEY
    tls_verify: true
