name: hrafnholt
services:
  dashboard:
    # Hrafnholt v0.1.15. Keep the digest when copying this example.
    image: ghcr.io/d4rk22/hrafnholt-dashboard@sha256:8757ee31b122947a9a52efd2bf8837ee409b963e7bc7029e5c0dcf68c899f7a5
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./hrafnholt.yml
        target: /etc/hrafnholt/hrafnholt.yml
        read_only: true
        bind:
          create_host_path: false
      - state:/var/lib/hrafnholt
volumes:
  state:
