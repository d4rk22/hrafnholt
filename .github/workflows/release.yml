name: Release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'd4rk22/hrafnholt'
    uses: ./.github/workflows/ci.yml

  release-metadata:
    name: Release / metadata
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require immutable release inputs
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo 'Release tag must be an exact vMAJOR.MINOR.PATCH version.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${GITHUB_REF_NAME#v}"
          node -e "const packageDocument=require('./package.json'); if (packageDocument.version !== process.argv[1]) process.exit(1)" "$version"
          grep -F "## [$version]" CHANGELOG.md

  publish:
    name: Release / ${{ matrix.component }}
    needs:
      - validate
      - release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dashboard
            context: .
            title: Hrafnholt dashboard
          - component: energy
            context: ./energy
            title: Hrafnholt energy sidecar
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/d4rk22/hrafnholt-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push image, SBOM, and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            HRAFNHOLT_VERSION=${{ github.ref_name }}
            HRAFNHOLT_REVISION=${{ github.sha }}
            HRAFNHOLT_SOURCE=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Record immutable digest
        # Registry-native attestations bind subject-digest: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' 'ghcr.io/d4rk22/hrafnholt-${{ matrix.component }}' '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  verify-private-packages:
    name: Release / verify private packages
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Deliberately credential-free: "private" means anonymous registry access
    # is denied. The previous check called the user-scoped packages API with
    # the Actions installation token, which can never act as the
    # authenticated user, so it returned 403 and failed on every release
    # ever cut (v0.1.0 through v0.1.4) without verifying anything.
    permissions: {}
    steps:
      - name: Require anonymous registry access to be denied
        run: |
          set -euo pipefail
          for package in hrafnholt-dashboard hrafnholt-energy; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:d4rk22/${package}:pull")"
            if [ "${status}" != "401" ]; then
              echo "::error::anonymous pull-token request for ${package} returned HTTP ${status} instead of 401; the package may be public"
              exit 1
            fi
          done
