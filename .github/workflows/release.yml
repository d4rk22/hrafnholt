name: Release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'd4rk22/hrafnholt'
    uses: ./.github/workflows/ci.yml

  release-metadata:
    name: Release / metadata
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require immutable release inputs
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo 'Release tag must be an exact vMAJOR.MINOR.PATCH version.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${GITHUB_REF_NAME#v}"
          node -e "const packageDocument=require('./package.json'); if (packageDocument.version !== process.argv[1]) process.exit(1)" "$version"
          grep -F "## [$version]" CHANGELOG.md

  publish:
    name: Release / ${{ matrix.component }}
    needs:
      - validate
      - release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dashboard
            context: .
            title: Hrafnholt dashboard
          - component: energy
            context: ./energy
            title: Hrafnholt energy sidecar
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/d4rk22/hrafnholt-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push image, SBOM, and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            HRAFNHOLT_VERSION=${{ github.ref_name }}
            HRAFNHOLT_REVISION=${{ github.sha }}
            HRAFNHOLT_SOURCE=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Record immutable digest
        # Registry-native attestations bind subject-digest: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' 'ghcr.io/d4rk22/hrafnholt-${{ matrix.component }}' '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

  verify-public-packages:
    name: Release / verify public packages
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Deliberately credential-free: "public" means an anonymous client can
    # pull this run's tag end-to-end. Inverted from verify-private-packages
    # when the packages went public with v0.1.8.
    permissions: {}
    steps:
      - name: Require anonymous pulls to succeed
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for package in hrafnholt-dashboard hrafnholt-energy; do
            token="$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:d4rk22/${package}:pull" | jq -r '.token // empty')"
            if [ -z "${token}" ]; then
              echo "::error::anonymous pull-token request for ${package} failed; the package may still be private"
              exit 1
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/d4rk22/${package}/manifests/${tag}")"
            if [ "${status}" != "200" ]; then
              echo "::error::anonymous manifest fetch for ${package}:${tag} returned HTTP ${status} instead of 200"
              exit 1
            fi
          done
