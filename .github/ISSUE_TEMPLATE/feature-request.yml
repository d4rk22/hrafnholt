name: Feature request
description: Propose a portable, read-only Hrafnholt improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the generic operator need without private deployment details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: The proposal preserves Hrafnholt's read-only application boundary.
          required: true
        - label: Examples and attachments contain no private or production-derived data.
          required: true
